[project]
name = "fortune-app"
version = "0.1.0"
description = "Minimal service deployed to ECS Fargate by the fortune pipelines."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.120.4",
    "uvicorn[standard]==0.38.0",
    "duckdb==1.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fortune"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
